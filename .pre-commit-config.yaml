exclude: |
  (?x)^(
    # ---- Project-specific excludes: add per-project paths/globs below ----
    # Nothing is excluded globally. Kit extensions under extensions/ are skipped
    # by the mypy hook ONLY, via that hook's own `exclude:` key further down --
    # a top-level exclude here would disable ruff, formatting and the hygiene
    # hooks on them too, leaving that code entirely unchecked.
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
      - id: check-xml
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-docstring-first
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        stages: [pre-commit]
        # Settings (strictness, excludes, etc.) live in [tool.mypy] in
        # pyproject.toml so `mypy .` locally matches this hook exactly.
        #
        # Kit extensions are the one exception. Their node modules import omni,
        # carb and OGN-generated *Database classes that exist only inside Isaac
        # Sim's runtime, so mypy cannot resolve them. `[tool.mypy] files` does
        # not help here because pre-commit passes explicit filenames, which
        # override it. This PER-HOOK exclude is the correct narrow fix: it skips
        # mypy for extensions/ while ruff, ruff-format and every hygiene hook
        # still check them. Do NOT move this to the top-level `exclude:` — that
        # would disable all hooks on extensions/ and leave the code unchecked.
        exclude: ^extensions/
        # Add per-package type stubs here as needed, e.g.:
        # additional_dependencies: ["types-requests", "types-PyYAML"]
        additional_dependencies: []

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture layering)
        # Enforces the contracts in [tool.importlinter] in pyproject.toml: the pure
        # kernel must not import sim/devkit/sidecar/debug, and nothing outside sim may
        # import omni/carb/pxr. Layering rot is invisible in review and expensive to
        # unwind later, so it is checked on every commit.
        #
        # `language: system` because import-linter is installed system-wide from
        # requirements-dev.txt, matching the no-venv convention. It needs PYTHONPATH=src
        # to import the package, and it always analyses the whole graph, so
        # pass_filenames is off and the hook runs once regardless of what changed.
        entry: env PYTHONPATH=src lint-imports
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]
