[package]
version = "1.0.0"
icon = "data/position_pic.png"
category = "SIM"
title = "Isaac Core Position"
description = "OmniGraph nodes that read global position data from UDP or ROS 2 sources"
authors = ["isaac_core team"]
repository = ""
readme = "docs/README.md"
keywords = ["position", "udp", "ros2", "lla", "lat", "lon", "alt", "roll", "pitch", "yaw", "mavros"]

[[python.module]]
name = "isaac_core_ogn.position"

[ogn]
path = "isaac_core_ogn/position/nodes"

[fswatcher.patterns]
include = ["*.ogn", "*.py"]
exclude = ["Ogn*Database.py"]

# Only omni.graph. The ROS 2 bridge dependency was left over from the
# Ros2ToGlobalPosition node, which was removed when Isaac Sim 6's Python 3.12 made
# rclpy unimportable. Declaring it transitively enabled the bridge, which crashed
# the process on stage open.
[dependencies]
"omni.graph" = {}
