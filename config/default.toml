# =============================================================================
# isaac_core default configuration
# =============================================================================
#
# This file is the complete configuration surface. Every value the simulation
# runs on appears here, and a user config passed with `--config` can override any
# of it. There is no second file to edit: layer manifests (layer.toml) declare
# *wiring* -- which config key maps to which prim attribute -- and never values.
#
# Resolution order, later wins:
#
#   this file
#     -> --config <file> / $ISAAC_CORE_CONFIG
#       -> environment (ISAAC_CORE__CAMERAS__EO__FOV_DEG=90)
#         -> CLI flags
#           -> runtime patches over the control plane
#
# Inspect the result with `isaac-core config dump`, and find out which source won
# a particular key with `isaac-core config explain <key>`.
# =============================================================================


# -----------------------------------------------------------------------------
# [sim] -- simulator lifecycle
# -----------------------------------------------------------------------------
[sim]
# Scene to open. A logical name resolved through [assets].search_paths, or an
# absolute path to a .usd/.usda file.
scene = "earth"

# Run without a GUI window.
headless = false

# Prim path the main viewport looks through when running with a GUI. `{instance}` is
# replaced with the vehicle id. Without this the window keeps Kit's default perspective
# camera, so the aircraft camera can be tracking correctly while the view appears frozen.
# Set to "" to leave the viewport alone.
viewport_camera = "/World/Environment/{instance}/Xform/main_camera_01"

# RTX render mode. This project wants a correct image, not a photoreal one, so it does not
# use Isaac's "RealTimePathTracing" default. Also accepts "PathTracing",
# "RealTimePathTracing" and "MinimalRendering" (alias "Minimal"). Matching is
# case-insensitive; an unknown value is rejected at config load, not passed to Isaac.
# "MinimalRendering" draws NO Cesium 3D Tiles terrain -- the scene loads healthy but empty
# -- so it validates with a warning. Use "RaytracedLighting" to see terrain.
renderer = "RaytracedLighting"

# Kit experience to launch. A bare filename resolves against Isaac's apps directory; an
# absolute path is used as given; "" accepts Isaac's own default. Isaac defaults to the
# minimal `isaacsim.exp.base.python.kit`, which behaves differently from the editor the team
# authors USD in -- using the full app keeps the two consistent.
experience = "isaacsim.exp.full.kit"

# Extensions enabled by Kit at startup, via `--enable`, rather than afterwards.
# This matters for anything contributing USD SCHEMAS. Enabling `cesium.omniverse` after
# startup reports success but leaves CesiumTilesetPrim unregistered: the prim resolves as
# untyped with a handful of raw attributes, is not Xformable, and no terrain is drawn -- with
# no error anywhere. At boot the schema registers and the prim gains its full property set.
boot_extensions = ["cesium.usd.plugins", "cesium.omniverse"]

# Extra folders Kit searches for extensions, each passed as `--ext-folder`.
# Isaac's headless python experience does not search Omniverse's user extension registry,
# where anything installed through the GUI's extension manager lives -- Cesium included.
# Without this a CesiumTilesetPrim loads as valid USD that draws nothing, so you get a
# blank scene with no error. Missing paths are skipped, so this default is portable.
extension_search_paths = ["~/.local/share/ov/data/exts/v2"]

# What to do when a requested feature's stage requirements are not met.
# false: skip the feature and log why (good for a sandbox).
# true:  fail immediately (good for CI).
strict_features = false

physics_dt = 0.016666666666666666
# Metres per stage unit. The whole pipeline assumes 1 unit == 1 metre (ENU translates are
# metres); the compositor applies this via UsdGeom.SetStageMetersPerUnit and warns loudly if
# it is not 1.0 or if it conflicts with the scene's own declaration.
stage_units_in_meters = 1.0


# -----------------------------------------------------------------------------
# [sim.control_plane] -- JSON-RPC command channel
# -----------------------------------------------------------------------------
# Low-rate commands only: query state, patch config, enable features, capture a
# frame. Pose and sensor data never travel over this.
#
# SECURITY: this channel can write files and mutate the running simulation.
# Binding to anything other than a loopback address REQUIRES a token, and
# `capture_frame` paths are confined under output_root.
[sim.control_plane]
# Disable for a batch render, or when bisecting a crash: one fewer background
# thread touching Kit's event loop.
enabled = true
host = "127.0.0.1"
port = 8760
token = ""
output_root = "~/isaac_core_out"


# -----------------------------------------------------------------------------
# [assets] -- where scenes, layers and heavy binaries are found
# -----------------------------------------------------------------------------
[assets]
# Extra directories searched for scenes, ahead of the packaged ones. Also
# settable with $ISAAC_CORE_ASSET_PATH.
search_paths = []

# Extra directories scanned for feature layers (each subdirectory containing a
# layer.toml). This is how a project adds its own features without forking or
# editing this repo.
layer_search_paths = []

# Optional sky HDRI. Large binaries are not shipped in the package; if this
# cannot be resolved the scene falls back to a default dome light rather than
# failing.
# hdri = "sunflowers_puresky_4k.exr"


# -----------------------------------------------------------------------------
# [geo] -- georeferencing and rotation conventions
# -----------------------------------------------------------------------------
[geo]
# Local ENU tangent plane anchor. Cesium georeferences the terrain to the same
# point, so this must match the scene.
enu_reference = { lat_deg = 32.22481, lon_deg = 35.25621, alt_m = 516.7 }


# -----------------------------------------------------------------------------
# [cesium] -- 3D Tiles terrain
# -----------------------------------------------------------------------------
[cesium]
# Tileset server. Deliberately has NO default: the previous generation baked an
# internal IP into consts.py and nine times into earth.usda. Set it here, in your
# own config, or with $ISAAC_CORE__CESIUM__TILESET_SERVER_URL.
# tileset_server_url = "http://tiles.your-lan:8088"

tilesets_root = "/tilesets"

# Long sessions can grow ~/.cache/ov/cesium-request-cache.sqlite-wal to hundreds
# of gigabytes, after which Isaac Sim fails to start. Enable to clear it on launch.
delete_cache_on_launch = true


# -----------------------------------------------------------------------------
# [features] -- which feature layers to compose onto the scene
# -----------------------------------------------------------------------------
[features]
enabled = ["camera_udp", "distance_sensor"]


# -----------------------------------------------------------------------------
# [vehicles] -- one entry per aircraft. Default is a single vehicle.
# -----------------------------------------------------------------------------
# With exactly one vehicle, topic namespacing collapses and you get the familiar
# flat names (/isaac_core/image_rgb). Add a second and every vehicle's topics
# become namespaced automatically (/isaac_core/lead/eo/image_rgb).
[vehicles.drone_0]
# udp     -- pose packets on a UDP port; physics does not matter, place it anywhere
# ros     -- NavSatFix + PoseStamped, typically MAVROS over ArduCopter SITL
# script  -- driven directly over the control plane
# replay  -- played back from a recorded track
# mavlink -- MAVLink consumed without MAVROS
pose_source = "udp"

# Defaults to 33333 + vehicle index. Set explicitly to pin it.
# udp_port = 33333

# For pose_source = "ros". Defaults derive from mavros_namespace.
# mavros_namespace = "/mavros"
# lla_topic = "/mavros/global_position/global"
# orientation_topic = "/mavros/local_position/pose"

# Mount point in the stage. Defaults to /Environment/<vehicle_id>.
# mount = "/Environment/drone_0"

# Frame for roll/pitch/yaw *movement commands* on the airframe.
# world -- extrinsic, about fixed world axes (R_delta @ R_current)
# body  -- intrinsic, about the vehicle's own axes (R_current @ R_delta)
# How roll, pitch and yaw compose for this vehicle.
#   "world" - aerospace yaw-pitch-roll: yaw is about world up, so heading holds
#             regardless of attitude. Pitched straight down, changing yaw spins the
#             view about its centre instead of moving where the nose points.
#   "body"  - roll, then pitch about the rolled axis, then yaw about the pitched axis.
#             Yaw therefore behaves like a body-axis rotation.
rotation_frame = "world"


# -----------------------------------------------------------------------------
# [vehicles.<id>.gimbal]
# -----------------------------------------------------------------------------
[vehicles.drone_0.gimbal]
start_roll_deg = 0.0
start_pitch_deg = 0.0
start_yaw_deg = 0.0

# Slew rate limit. Omit for instantaneous snapping, which is what the previous
# generation did unconditionally.
max_rate_deg_s = 60.0

# A gimbal is bolted to the airframe, so body frame is the physical default.
rotation_frame = "body"


# -----------------------------------------------------------------------------
# [vehicles.<id>.cameras.<id>] -- one or many cameras per vehicle
# -----------------------------------------------------------------------------
[vehicles.drone_0.cameras.eo]
resolution = [1280, 720]
fov_deg = 78.1
focal_length_mm = 22.7885

# Lens focus distance in scene units (metres, since stage_units_in_meters = 1.0). Only has a
# visible effect once f_stop is non-zero; with depth of field off, everything is in focus.
focus_distance = 400.0

# Lens f-number. IMPORTANT: 0 means depth of field is OFF -- the everything-in-focus pinhole
# image this project has always produced, and the default here. It does NOT mean a wide-open
# aperture. Set a positive value together with focus_distance to get a photographic blur.
f_stop = 0.0

# Direct sensor-aperture override in millimetres. Leave unset (the default) to derive the
# aperture from fov_deg + focal_length_mm, which is the historical behaviour. Set either axis
# to pin it, in which case fov_deg is IGNORED for that axis -- setting both an explicit
# aperture and a non-default fov_deg is a mistake the configurator warns about, naming which
# value won. The vertical axis, when left unset, follows the horizontal aperture and the
# resolution aspect ratio so the image is not stretched.
# horizontal_aperture_mm = 36.0
# vertical_aperture_mm = 20.25

# Topics default to the namespaced convention; override to publish elsewhere.
# image_topic = "/isaac_core/image_rgb"

# A second camera on the same aircraft. Uncomment to enable; topics then become
# /isaac_core/eo/image_rgb and /isaac_core/ir/image_rgb.
# [vehicles.drone_0.cameras.ir]
# resolution = [640, 512]
# fov_deg = 25.0


# -----------------------------------------------------------------------------
# [layers.<layer_id>] -- per-layer settings
# -----------------------------------------------------------------------------
# Every feature layer owns the namespace [layers.<its_id>] and declares its own
# schema, so a third-party layer dropped into layer_search_paths extends this
# config with zero changes to isaac_core.
[layers.distance_sensor]
min_range_m = 0.2
max_range_m = 180.0
# topic = "/isaac_core/distance_sensor"

[layers.bbox_publisher]
root_prim = "/bboxes"
# topic = "/isaac_core/bbox"

[layers.sat]
# topic = "/isaac_core/sat"


# -----------------------------------------------------------------------------
# [ros2]
# -----------------------------------------------------------------------------
[ros2]
domain_id = 13
# NOTE: there is no `use_sim_time` key. It is a consumer-side rclpy node parameter (a node
# reads /clock instead of the wall clock), but this project runs no rclpy nodes inside Isaac
# and the C++ bridge's ROS2Context node exposes no such input. Our publishers already stamp
# every message with real simulation time via IsaacReadSimulationTime -> SecondsToRosStamp,
# so the setting was redundant by construction. Removed rather than faked.


# -----------------------------------------------------------------------------
# [sidecar] -- services that cannot run inside Isaac's interpreter
# -----------------------------------------------------------------------------
# Supervised as a peer process, not forked by the simulator. Started by the
# devkit alongside the sim.
[sidecar]
enabled = false

# No services ship today. Video streaming used to live here and now does not: Isaac's native
# RTSP publishes straight from the camera graph, so no out-of-process helper is needed for it.
#
# The mechanism is kept deliberately, for work that genuinely cannot run inside Isaac's
# interpreter -- anything needing rclpy, for instance, which is built for Python 3.10 while
# Isaac runs 3.12.
#
# [sidecar.services.my_service]
# kind = "my_service_kind"


# -----------------------------------------------------------------------------
# [logging]
# -----------------------------------------------------------------------------
[logging]
level = "info"

# Forward Isaac Sim's own (very verbose) stdout.
# Let Kit's own logging through. False cuts a launch from roughly 3,400 lines to 600 by
# filtering the Python loggers listed below; our own output is never filtered.
isaac_logs = false

# Python loggers dropped below WARNING when isaac_logs is false. These set their own
# level while loading, so they are filtered at the handler rather than by level.
quiet_loggers = [
  "ogn_registration",
  "AutoNode",
  "omni",
  "omni.kit",
  "usd_validation_nvidia",
  "matplotlib",
  "asyncio",
  "isaacsim",
  "cesium",
]


# -----------------------------------------------------------------------------
# [[prim_overrides]] -- escape hatch
# -----------------------------------------------------------------------------
# Raw prim attribute writes, applied after everything else. For the case where a
# layer author did not expose a knob you need, so you are never blocked waiting
# on us. The tidier fix is copying the layer directory into your own
# layer_search_paths and editing its manifest.
#
# [[prim_overrides]]
# prim = "/Environment/drone_0/ROS2CameraImageExport/cameraHelperDepth"
# attribute = "inputs:enabled"
# value = false
