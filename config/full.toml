# Every isaac_core setting, at its default value. Copy this file and edit it as needed.
# Not loaded automatically:  isaac-core run --config config/full.toml
# Commented-out keys are optional; the note says what happens when left unset.


[sim]
scene = "earth"                        # logical name on assets.search_paths, or a path to a .usd/.usda
headless = false                       # no window; capture_frame does not work headless
strict_features = false                # true: refuse to start if a requested layer cannot compose
experience = "isaacsim.exp.full.kit"   # Kit experience file, absolute path or a name in Isaac's apps/
renderer = "RaytracedLighting"         # RaytracedLighting, PathTracing, MinimalRendering (no terrain)
physics_dt = 0.016666666666666666      # simulation timestep in seconds; > 0
stage_units_in_meters = 1.0            # metres per stage unit; > 0
viewport_camera = "/World/Environment/{instance}/Xform/main_camera_01"   # {instance} is the vehicle id
extensions = [                         # Kit extensions enabled after the app starts
    "omni.graph.action",
    "omni.graph.nodes",
    "isaacsim.core.nodes",
    "isaacsim.ros2.bridge",
    "isaacsim.streaming.rtsp",
    "isaac_core_ogn.math",
    "isaac_core_ogn.position",
    "isaac_core_ogn.sensors",
]
boot_extensions = ["cesium.usd.plugins", "cesium.omniverse"]   # enabled before the app starts
extension_search_paths = ["~/.local/share/ov/data/exts/v2"]    # where Cesium installs itself

[sim.control_plane]
enabled = true                         # the devkit and isaac-core-inspect need this
host = "127.0.0.1"                     # a non-loopback host is refused unless token is set
port = 8760                            # 1024-65535
token = ""                             # shared secret; required for a non-loopback host
output_root = "~/isaac_core_out"       # capture_frame paths are resolved under here and confined to it


[assets]
search_paths = []                      # extra directories searched for scenes, before the packaged ones
layer_search_paths = []                # extra directories scanned for layer.toml; adds to the packaged layers
# hdri = "sky.exr"                     # unset: the scene's own lighting. A bare name is looked up on search_paths


[geo]
# Must match the scene's CesiumGeoreference. A pose at this lat/lon sits at stage origin, and stage
# z is altitude - alt_m. A mismatch over one metre is reported at startup.
enu_reference = { lat_deg = 32.22481, lon_deg = 35.25621, alt_m = 516.7 }


[cesium]
# tileset_server_url = "http://tiles.your-lan:8088"   # unset: whatever the scene already points at
tilesets_root = "/World/tilesets"      # subtree searched for tileset prims to repoint
delete_cache_on_launch = false         # true: re-stream terrain every run, avoiding a stalled startup
# max_simultaneous_tile_loads = 20     # unset: Cesium's own default. > 0
# max_screen_space_error = 16.0        # unset: Cesium's own default. Higher is coarser and faster. > 0
# max_cached_bytes = 536870912         # unset: Cesium's own default. > 0
# preload_ancestors = true             # unset: Cesium's own default
# preload_siblings = true              # unset: Cesium's own default


[features]
# Layer ids to compose. The camera layer is implied by each vehicle's pose_source, so it is not listed
# here. Shipped ids: distance_sensor, bbox. Your own layers are named by their layer.toml id.
enabled = []


# One table per vehicle. The name is the vehicle id, used in topics, prim paths and port offsets.
[vehicles.drone_0]
pose_source = "udp"                    # udp or ros; this chooses the camera layer
rotation_frame = "world"               # world: yaw about world up (aerospace). body: yaw about the pitched axis
mavros_namespace = "/mavros"           # only used when pose_source = "ros"
# udp_port = 33333                     # unset: 33333 + vehicle index
# mount = "/World/Environment/{instance}"        # unset: /World/Environment/<id>
# lla_topic = "/mavros/global_position/global"   # unset: derived from mavros_namespace
# orientation_topic = "/mavros/local_position/pose"   # unset: derived from mavros_namespace

[vehicles.drone_0.gimbal]
start_roll_deg = 0.0                   # +roll drops the right side of the image
start_pitch_deg = 0.0                  # +pitch aims up
start_yaw_deg = 0.0                    # +yaw swings right
# max_rate_deg_s = 60.0                # unset: snap instantly. > 0. The only key patchable at runtime

[vehicles.drone_0.distance_sensor]
min_range_m = 0.2                      # readings below this saturate. >= 0
max_range_m = 5000.0                   # readings beyond this saturate. > 0
# topic = "/isaac_core/distance_sensor"    # unset: derived, namespaced per vehicle when there are several

# One camera per vehicle. A second camera in this table is accepted but not yet composed, so use a
# second vehicle instead.
[vehicles.drone_0.cameras.eo]
resolution = [1280, 720]               # pixels, also the published image size
fov_deg = 78.1                         # horizontal field of view; 0 < fov <= 180
focal_length_mm = 22.7885              # with the apertures, this is what sets the projection
focus_distance = 400.0                 # metres; only visible with f_stop > 0. > 0
f_stop = 0.0                           # 0 disables depth of field. >= 0
# horizontal_aperture_mm = 20.955      # unset: derived from fov_deg and focal_length_mm. > 0
# vertical_aperture_mm = 11.7875       # unset: derived from the resolution's aspect ratio. > 0
# rtsp_port = 8554                     # unset: 8554 + vehicle index
# rtsp_mount_path = "/stream"          # unset: derived, namespaced per vehicle when there are several
# image_topic = "/isaac_core/image_rgb"    # unset: derived, namespaced per vehicle when there are several


[ros2]
# domain_id = 13                       # unset: inherit $ROS_DOMAIN_ID. 0-232


[logging]
level = "info"                         # debug, info, warning or error
isaac_logs = false                     # true: keep Isaac's own output, which is thousands of lines
quiet_loggers = [                      # loggers silenced unless isaac_logs is true
    "ogn_registration",
    "AutoNode",
    "omni",
    "omni.kit",
    "usd_validation_nvidia",
    "matplotlib",
    "asyncio",
    "isaacsim",
    "cesium",
]


[sidecar]
enabled = false                        # true: start the services below alongside the simulator

# One table per service, started and restarted by the sidecar.
[sidecar.services]
# recorder = { kind = "command", command = ["python3", "record.py"] }


# Settings for your own feature layers, read by a layer.toml binding as layers.<layer id>.<key>.
[layers]
# thermal_cam = { gain = 1.5 }


# Escape hatch: write any USD attribute on any prim after the layers are applied. Last writer wins,
# so this overrides a layer binding that targets the same prim and attribute.
# [[prim_overrides]]
# prim = "/World/Environment/drone_0/Xform/main_camera_01"
# attribute = "focalLength"
# value = 35.0


# A second vehicle gets its own camera, ports, topic namespace and prim mount. Topics are namespaced
# only when more than one vehicle is configured, so a single vehicle keeps the plain names.
# [vehicles.wing]
# pose_source = "udp"                  # udp port becomes 33334, RTSP 8555
# [vehicles.wing.cameras.eo]
# resolution = [1280, 720]
