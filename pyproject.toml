[project]
name = "isaac-core"
version = "0.2.0"
description = "Team infrastructure for building, running and scripting Isaac Sim 6 simulations"
requires-python = ">=3.10"

readme = "README.md"
license = "Apache-2.0"
keywords = [
    "isaac-sim",
    "omniverse",
    "simulation",
    "cesium",
    "3d-tiles",
    "geospatial",
    "ros2",
    "robotics",
    "camera",
    "digital-twin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24,<3",
    "pydantic>=2.6,<3",
    "pyproj>=3.6,<4",
    "tomli>=2.0,<3; python_version < '3.11'",
    "transforms3d>=0.4,<0.5",
]

[project.urls]
Repository = "https://github.com/JerichoGroup/isaac_core_6"
Issues = "https://github.com/JerichoGroup/isaac_core_6/issues"

[project.scripts]
isaac-core = "isaac_core.cli.main:cli"
isaac-core-pose-sender = "isaac_core.debug.pose_sender_gui:main"
isaac-core-inspect = "isaac_core.debug.inspector:main"
isaac-core-mavlink = "isaac_core.devkit.mavlink:main"

[project.optional-dependencies]
# Installed into Isaac Sim's bundled interpreter:
#   <isaac-sim>/python.sh -m pip install -e ".[sim]"     (scripts/setup.sh does this)
# `omni`, `carb` and `pxr` ship with Isaac Sim and are deliberately never pip
# dependencies.
sim = []

# Installed into any interpreter that has ROS 2 sourced. `rclpy` comes from
# `source /opt/ros/humble/setup.bash`, not from pip, which is why it is absent here.
# opencv-python is only needed to write video; recording poses does not use it.
devkit = [
    "opencv-python>=4.8,<5",
]

# Services that cannot live inside Isaac's interpreter (GStreamer via PyGObject)
# run on system python3. PyGObject is installed with apt rather than pip, because
# the pip build needs libgirepository/pkg-config/cairo headers and frequently
# fails, so this extra is empty:
#
#   apt install python3-gi python3-gi-cairo gir1.2-gstreamer-1.0 \
#               gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base \
#               gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
#               gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools
sidecar = []

# GUIs use stdlib tkinter, which needs `apt install python3-tk`.
debug = []

dev = [
    "pytest==8.3.4",
    "mypy==1.14.1",
    "ruff==0.8.2",
    "pre-commit==4.0.1",
    "gitlint==0.19.1",
    "import-linter==2.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Data files inside the package are NOT shipped unless listed here.
#   py.typed         -- without it a consumer's type checker silently ignores every annotation.
#   assets/**        -- the shipped feature layers (manifest + USD) and the `earth` scene. These
#                       used to live in a repo-level `usd/` directory outside the package, so a
#                       non-editable install had no layers and no scene and could not compose
#                       anything. The resolvers already looked in these packaged locations; only
#                       the files were in the wrong place.
[tool.setuptools.package-data]
isaac_core = [
    "py.typed",
    "assets/layers/*/layer.toml",
    "assets/layers/*/*.usda",
    "assets/scenes/*.usda",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    # ---- Project-specific excludes: add per-project paths/globs below ----
    # "docker/vendor/",
    # "legacy/",
]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.format]

quote-style = "double"

indent-style = "space"


[tool.ruff.lint]
select = [
    "E",        # Errors
    "F",        # pyflakes
    "W",        # Warnings
    "I",        # Isort
    "N",        # pep8-naming
    "ANN",      # flake8-annotations
    "Q",        # flake8-quotes
    "ERA",      # Eradicate
    "PLR",      # Refactor
    "A",        # flake8-builtins
    "ASYNC",    # flake8-async
    "PTH",      # flake8-use-pathlib
    "FIX",      # flake8-fixme
    "TD",       # flake8-todos
    "D",         # pydocstyle
    "RUF100",   # Unused `noqa` directive
                # Enabled deliberately: 91 of ~190 suppressions in this repo were found to be
                # protecting against rules that never fired. Nothing was checking them.
]

ignore = [
    "E501",     # Line too long ({width} > {limit})
    "D203",     # 1 blank line required before class docstring
    "D202",     # No blank lines allowed after function docstring (found {num_lines})
    "D213",     # Multi-line docstring summary should start at the second line
                # D212 and D213 are mutually exclusive; PEP 257 and Google style both want the
                # summary on the first line, so D212 is enforced and D213 ignored.
    "PLR0913",  # Too many arguments in function definition ({c_args} > {max_args})
    "ANN401",   # Dynamically typed expressions (typing.Any) disallowed
                # Allowed deliberately: the JSON-RPC and config boundaries carry arbitrary JSON,
                # and the Isaac Sim APIs ship no type stubs, so Any is the honest annotation.
]

fixable = ["ALL"]
unfixable = []



[tool.ruff.lint.pydocstyle]
ignore-decorators = []
property-decorators = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104", "D100"]
# N802: fakes for Pixar's USD API must copy its PascalCase method names exactly
# (IsValid, GetAttribute, GetPrimAtPath), or they are not substitutable for the real thing.
"tests/**" = ["PLR2004", "D103", "ANN201", "N802"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]

# ---- Project-specific excludes: add per-project paths/regex below ----
exclude = [
    # '^legacy/',
]

# Strict-ish baseline. Tighten further (e.g. full `strict = true`) once the
# codebase is fully typed.
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Show clearer output.
pretty = true
show_error_codes = true

# ---------------------------------------------------------------------------
# Modules that cannot be resolved in a plain venv.
#
# `omni`, `carb`, `pxr` and `isaacsim` are provided by Isaac Sim's bundled
# interpreter; `rclpy` and the ROS message packages come from a sourced ROS 2
# environment; `gi` comes from the system PyGObject package. None are pip
# installable here, so mypy cannot see them.
#
# These are narrow, per-module overrides rather than a blanket
# `ignore_missing_imports`, so anything else unresolved is still an error.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    "carb.*",
    "gi.*",
    "isaacsim.*",
    "omni.*",
    "pxr.*",
    "rclpy.*",
]
ignore_missing_imports = true

# Third-party packages that ship no type stubs.
[[tool.mypy.overrides]]
module = [
    "pyproj.*",
    "transforms3d.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Layering contracts, enforced by import-linter (`lint-imports`).
#
# The kernel (contracts -> config -> geo -> protocol -> vehicle) must stay pure:
# importable with neither Isaac Sim nor ROS 2 present, and therefore unit
# testable in CI without a GPU. These contracts are what stop that eroding.
#
# NOTE: import-linter errors on a module that does not exist, so these contracts
# list only the packages built so far. EXTEND THEM as each new package lands:
#   vehicle                 -> add to the layers list above config
#   sim, devkit, sidecar, debug -> add to forbidden_modules, and re-enable the
#                                  "simulator does not depend on the devkit" contract
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "isaac_core"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Config depends only on contracts"
type = "layers"
layers = [
    "isaac_core.config",
    "isaac_core.contracts",
]

[[tool.importlinter.contracts]]
name = "Geo depends only on contracts"
type = "layers"
layers = [
    "isaac_core.geo",
    "isaac_core.contracts",
]

[[tool.importlinter.contracts]]
name = "Protocol depends only on contracts"
type = "layers"
layers = [
    "isaac_core.protocol",
    "isaac_core.contracts",
]

[[tool.importlinter.contracts]]
name = "Geo and protocol are independent of each other"
type = "independence"
modules = [
    "isaac_core.geo",
    "isaac_core.protocol",
]

[[tool.importlinter.contracts]]
name = "Geo does not depend on config"
type = "forbidden"
source_modules = ["isaac_core.geo"]
forbidden_modules = ["isaac_core.config"]

[[tool.importlinter.contracts]]
name = "Protocol does not depend on config"
type = "forbidden"
source_modules = ["isaac_core.protocol"]
forbidden_modules = ["isaac_core.config"]

[[tool.importlinter.contracts]]
name = "Contracts depend on nothing else in the project"
type = "forbidden"
source_modules = ["isaac_core.contracts"]
forbidden_modules = [
    "isaac_core.config",
    "isaac_core.geo",
    "isaac_core.protocol",
]

[[tool.importlinter.contracts]]
name = "Vehicle depends only on contracts and geo"
type = "layers"
layers = [
    "isaac_core.vehicle",
    "isaac_core.geo",
    "isaac_core.contracts",
]

[[tool.importlinter.contracts]]
name = "Sim depends on contracts, config and control"
type = "layers"
layers = [
    "isaac_core.sim",
    "isaac_core.control",
    "isaac_core.config",
    "isaac_core.contracts",
]

[[tool.importlinter.contracts]]
name = "Vehicle does not import protocol or sim"
type = "forbidden"
source_modules = ["isaac_core.vehicle"]
forbidden_modules = [
    "isaac_core.protocol",
    "isaac_core.sim",
    "isaac_core.config",
]

[[tool.importlinter.contracts]]
# `sim` legitimately depends on `config` -- layer manifests bind config keys to prim
# attributes, and georeference resolution needs the config object -- so config is NOT
# forbidden here. What sim must not touch is the kernel's behavioural layers: it
# composes a stage and configures nodes, it does not do geodesy (that is the
# OmniGraph node's job), decode packets, or drive vehicles (that is the devkit's).
name = "Sim does not import vehicle, protocol or geo"
type = "forbidden"
source_modules = ["isaac_core.sim"]
forbidden_modules = [
    "isaac_core.vehicle",
    "isaac_core.protocol",
    "isaac_core.geo",
]

[[tool.importlinter.contracts]]
name = "Kernel packages do not import simulator or ROS dependencies"
type = "forbidden"
source_modules = [
    "isaac_core.contracts",
    "isaac_core.config",
    "isaac_core.geo",
    "isaac_core.protocol",
    "isaac_core.vehicle",
    "isaac_core.sim",
]
forbidden_modules = [
    "omni",
    "carb",
    "pxr",
    "rclpy",
    "gi",
]

# --- Contracts for control, cli, install and devkit ---

[[tool.importlinter.contracts]]
name = "Control depends only on config and contracts"
type = "layers"
layers = [
    "isaac_core.control",
    "isaac_core.config",
    "isaac_core.contracts",
]

[[tool.importlinter.contracts]]
name = "Control does not import sim, vehicle, geo or protocol"
type = "forbidden"
source_modules = ["isaac_core.control"]
forbidden_modules = [
    "isaac_core.sim",
    "isaac_core.vehicle",
    "isaac_core.geo",
    "isaac_core.protocol",
]

[[tool.importlinter.contracts]]
name = "Install depends on nothing in the project"
type = "forbidden"
source_modules = ["isaac_core.install"]
forbidden_modules = [
    "isaac_core.contracts",
    "isaac_core.config",
    "isaac_core.geo",
    "isaac_core.protocol",
    "isaac_core.vehicle",
    "isaac_core.sim",
    "isaac_core.control",
    "isaac_core.devkit",
    "isaac_core.cli",
]

[[tool.importlinter.contracts]]
name = "CLI does not import sim or devkit"
type = "forbidden"
source_modules = ["isaac_core.cli"]
forbidden_modules = [
    "isaac_core.sim",
    "isaac_core.devkit",
    "isaac_core.vehicle",
    "isaac_core.geo",
    "isaac_core.protocol",
]

# The devkit is a typed client for the control plane: `Sim.attach` needs only a host and a port, which
# is what lets it drive a simulator on another machine. Importing `sim` would drag in omni/carb/pxr and
# destroy that, so it stays forbidden.
#
# `vehicle` and `geo` are deliberately NOT forbidden. They are pure Python over numpy, pyproj and
# transforms3d -- all already hard requirements -- and they import nothing from `sim`, so using them
# cannot pull Isaac in. `PoseBot` composes those motion kernels with a transport, which is precisely
# what a scripting layer is for; the alternative was a pure kernel importing a transport, which is the
# dependency the wrong way round.
[[tool.importlinter.contracts]]
name = "Devkit does not import sim"
type = "forbidden"
source_modules = ["isaac_core.devkit"]
forbidden_modules = [
    "isaac_core.sim",
]

[[tool.importlinter.contracts]]
name = "Control, CLI, install, devkit and debug do not import omni/carb/pxr"
type = "forbidden"
source_modules = [
    "isaac_core.control",
    "isaac_core.cli",
    "isaac_core.install",
    "isaac_core.devkit",
    "isaac_core.debug",
]
forbidden_modules = [
    "omni",
    "carb",
    "pxr",
]

# --- Debug contracts ---

[[tool.importlinter.contracts]]
name = "Debug does not import sim"
type = "forbidden"
source_modules = ["isaac_core.debug"]
forbidden_modules = [
    "isaac_core.sim",
    "isaac_core.sidecar",
]

[[tool.importlinter.contracts]]
# The debug tools are end-user entry points, so nothing else may depend on them.
# Without this a helper could quietly migrate into debug/ and become load-bearing.
name = "Nothing depends on debug"
type = "forbidden"
source_modules = [
    "isaac_core.contracts",
    "isaac_core.config",
    "isaac_core.geo",
    "isaac_core.protocol",
    "isaac_core.vehicle",
    "isaac_core.control",
    "isaac_core.devkit",
    "isaac_core.sim",
    "isaac_core.cli",
    "isaac_core.sidecar",
]
forbidden_modules = ["isaac_core.debug"]

# --- Sidecar contracts ---

[[tool.importlinter.contracts]]
name = "Sidecar depends only on config and contracts"
type = "layers"
layers = [
    "isaac_core.sidecar",
    "isaac_core.config",
    "isaac_core.contracts",
]

[[tool.importlinter.contracts]]
name = "Sidecar does not import sim, vehicle, geo or protocol"
type = "forbidden"
source_modules = ["isaac_core.sidecar"]
forbidden_modules = [
    "isaac_core.sim",
    "isaac_core.vehicle",
    "isaac_core.geo",
    "isaac_core.protocol",
]

[[tool.importlinter.contracts]]
# The sidecar runs on system python3, NOT inside Isaac. It must never import
# omni/carb/pxr, which only exist in Isaac's bundled interpreter.
name = "Sidecar does not import omni/carb/pxr"
type = "forbidden"
source_modules = ["isaac_core.sidecar"]
forbidden_modules = [
    "omni",
    "carb",
    "pxr",
]
