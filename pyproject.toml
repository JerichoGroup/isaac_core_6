[project]
name = "dingo-project"
version = "0.1.0"
description = "Dingo's Python project template"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "mypy==1.14.1",
    "ruff==0.8.2",
    "pre-commit==4.0.1",
    "gitlint==0.19.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    # ---- Project-specific excludes: add per-project paths/globs below ----
    # "docker/vendor/",
    # "legacy/",
]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.format]

quote-style = "double"

indent-style = "space"


[tool.ruff.lint]
select = [
    "E",        # Errors
    "F",        # pyflakes
    "W",        # Warnings
    "I",        # Isort
    "N",        # pep8-naming
    "ANN",      # flake8-annotations
    "Q",        # flake8-quotes
    "ERA",      # Eradicate
    "PLR",      # Refactor
    "A",        # flake8-builtins
    "ASYNC",    # flake8-async
    "PTH",      # flake8-use-pathlib
    "FIX",      # flake8-fixme
    "TD",       # flake8-todos
    "D",         # pydocstyle
]

ignore = [
    "E501",     # Line too long ({width} > {limit})
    "D203",     # 1 blank line required before class docstring
    "D202",     # No blank lines allowed after function docstring (found {num_lines})
    "D212",     # Multi-line docstring summary should start at the first line
    "PLR0913",  # Too many arguments in function definition ({c_args} > {max_args})
]

fixable = ["ALL"]
unfixable = []



[tool.ruff.lint.pydocstyle]
ignore-decorators = []
property-decorators = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104", "D100"]
"tests/**" = ["PLR2004", "D103", "ANN201"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]

# ---- Project-specific excludes: add per-project paths/regex below ----
exclude = [
    # '^legacy/',
]

# Strict-ish baseline. Tighten further (e.g. full `strict = true`) once the
# codebase is fully typed.
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Show clearer output.
pretty = true
show_error_codes = true
