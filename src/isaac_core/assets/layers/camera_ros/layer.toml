id = "camera_ros"
usd = "camera_ros.usda"
# Where this layer is referenced into the stage. {instance} is the vehicle id, so
# the same layer mounts once per aircraft in a swarm. Note {mount} is NOT valid
# here -- that placeholder exists for BINDINGS, which refer back to this path.
mount = "/World/Environment/{instance}"
# Requires nothing of the base scene: this layer brings its own camera.
requires = []
provides = ["CAMERA"]

# --- PoseSync graph bindings -------------------------------------------------

[[bindings]]
prim = "{mount}/PoseSync/global_position_to_local_position"
attribute = "inputs:enu_reference"
resolve = "enu_origin"

[[bindings]]
prim = "{mount}/PoseSync/global_position_to_local_position"
attribute = "inputs:rotation_frame"
config = "vehicles.{instance}.rotation_frame"

[[bindings]]
prim = "{mount}/PoseSync/ros2_subscriber"
attribute = "inputs:topicName"
resolve = "orientation_topic"

[[bindings]]
prim = "{mount}/PoseSync/ros2_subscriber_01"
attribute = "inputs:topicName"
resolve = "lla_topic"

[[bindings]]
prim = "{mount}/PoseSync/ros2_publisher"
attribute = "inputs:topicName"
resolve = "global_pose_topic"

# --- CameraImageExport graph bindings ----------------------------------------

[[bindings]]
prim = "{mount}/CameraImageExport/ros2_camera_helper"
attribute = "inputs:topicName"
resolve = "image_topic"

[[bindings]]
prim = "{mount}/Xform/main_camera_01"
attribute = "focalLength"
config = "vehicles.{instance}.camera.focal_length_mm"

[[bindings]]
# Derived from fov_deg + focal_length_mm so the field of view actually takes effect.
prim = "{mount}/Xform/main_camera_01"
attribute = "horizontalAperture"
resolve = "camera_horizontal_aperture"

[[bindings]]
# Kept consistent with the resolution aspect ratio to avoid a stretched image.
prim = "{mount}/Xform/main_camera_01"
attribute = "verticalAperture"
resolve = "camera_vertical_aperture"

[[bindings]]
# Lens focus distance in scene units; only visible when fStop is non-zero.
prim = "{mount}/Xform/main_camera_01"
attribute = "focusDistance"
config = "vehicles.{instance}.camera.focus_distance"

[[bindings]]
# f-number. 0 means depth of field OFF, which is the default pinhole look.
prim = "{mount}/Xform/main_camera_01"
attribute = "fStop"
config = "vehicles.{instance}.camera.f_stop"

[[bindings]]
# Native RTSP stream (D21): always on, so these are the only knobs.
prim = "{mount}/CameraImageExport/rtsp_camera_helper"
attribute = "inputs:port"
resolve = "rtsp_port"

[[bindings]]
prim = "{mount}/CameraImageExport/rtsp_camera_helper"
attribute = "inputs:mountPath"
resolve = "rtsp_mount_path"

# Gimbal start attitude. These inputs were connected to a ROS subscriber until it was removed;
# a connected USD attribute ignores authored values, which is why these config keys never worked.
[[bindings]]
prim = "{mount}/PoseSync/global_position_to_local_position"
attribute = "inputs:offset_roll_deg"
config = "vehicles.{instance}.gimbal.start_roll_deg"

[[bindings]]
prim = "{mount}/PoseSync/global_position_to_local_position"
attribute = "inputs:offset_pitch_deg"
config = "vehicles.{instance}.gimbal.start_pitch_deg"

[[bindings]]
prim = "{mount}/PoseSync/global_position_to_local_position"
attribute = "inputs:offset_yaw_deg"
config = "vehicles.{instance}.gimbal.start_yaw_deg"

# Viewport name. Empty for a single vehicle so the active viewport is reused exactly as before;
# named per vehicle in a swarm, where sharing one viewport made the view flip between aircraft.

# Resolution is a property of the render product, which is now created directly from the camera.
# Offscreen, so no viewport window is involved and there is no name lookup to race.
[[bindings]]
prim = "{mount}/CameraImageExport/isaac_create_render_product"
attribute = "inputs:width"
config = "vehicles.{instance}.camera.width"

[[bindings]]
prim = "{mount}/CameraImageExport/isaac_create_render_product"
attribute = "inputs:height"
config = "vehicles.{instance}.camera.height"
